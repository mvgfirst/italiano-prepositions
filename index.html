<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Предлоги">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f5f8b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Preposizioni</title>
<style>
:root{
  --bg:#f4f7fa; --card:#ffffff; --fg:#17212b; --muted:#5d6b78; --line:#d5dee6;
  --acc:#1f5f8b; --acc-fg:#ffffff; --acc-soft:#e3eef6;
  --ok:#1b7a3d; --ok-soft:#dff3e6; --bad:#b3261e; --bad-soft:#fbe4e2; --it:#a3261f;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10161c; --card:#19222b; --fg:#e8eef3; --muted:#9aa9b6; --line:#2c3a46;
    --acc:#5aa5d6; --acc-fg:#0b1a24; --acc-soft:#1c2d3b;
    --ok:#5fd18a; --ok-soft:#173a26; --bad:#ff8a80; --bad-soft:#40201e; --it:#ff9d94;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:520px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
h1{font-size:26px;margin:4px 0 0}
h2{font-size:18px;margin:22px 0 8px}
.sub{color:var(--muted);font-size:15px;margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px}
.stat{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:15px}
.chip.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.big{display:block;width:100%;border:0;border-radius:16px;padding:18px;margin:10px 0;font-size:19px;font-weight:600;
  background:var(--acc);color:var(--acc-fg)}
.big.alt{background:var(--card);color:var(--fg);border:1px solid var(--acc)}
.big small{display:block;font-weight:400;font-size:14px;opacity:.85;margin-top:2px}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:22px}
.link{background:none;border:0;color:var(--acc);padding:6px 0;font-size:16px;text-decoration:underline}
.bar{margin:8px 0}
.bar .lab{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.bar .tr{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:3px}
.bar .fl{height:100%;background:var(--acc)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;color:var(--muted);font-size:15px}
.back{background:none;border:0;color:var(--acc);font-size:17px;padding:6px 0}
.ru{color:var(--muted);font-size:17px;margin-bottom:10px}
.it{font-size:25px;line-height:1.3;margin:6px 0 16px;color:var(--it);font-style:italic;word-break:break-word}
.blank{display:inline-block;min-width:52px;text-align:center;border-bottom:3px solid var(--acc);color:var(--acc);font-weight:700;font-style:normal;padding:0 4px}
.blank.good{color:var(--ok);border-color:var(--ok)}
.blank.bad{color:var(--bad);border-color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:16px 8px;font-size:20px;font-weight:600}
.opt.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.ghost{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font-size:16px;padding:8px 14px}
.fb{margin-top:14px;padding:12px;border-radius:12px;font-size:16px}
.fb.good{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:4px}
.card-front{font-size:28px;text-align:center;padding:34px 8px}
.card-back{font-size:26px;text-align:center;color:var(--it);font-style:italic;padding:8px}
.card-ex{font-size:18px;text-align:center;color:var(--muted);font-style:italic;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two button{border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:600}
.no{background:var(--bad-soft);color:var(--bad)} .yes{background:var(--ok-soft);color:var(--ok)}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);
  padding:10px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}
.note{color:var(--muted);font-size:14px}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.tip{background:var(--acc-soft);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.tip button{float:right;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;margin:-4px -4px 0 8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-size:17px}
.seg button.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.mist{margin:6px 0;padding:8px 10px;border-radius:10px;background:var(--bad-soft);font-size:16px}
.mist i{color:var(--it)}
.res{font-size:44px;font-weight:700;text-align:center;margin:10px 0 0}
footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script src="questions.js"></script>
<script>
(function () {
'use strict';

/* ================= Константы и данные ================= */
var KEY = 'preposizioni-v1';
var VERSION = '1.0';
var CAT = {place:'Место', time:'Время', verb:'Глагол + предлог', art:'Слияния', other:'Другое'};
var CAT_LOW = {place:'место', time:'время', verb:'глагол', art:'слияние', other:'другое'};
var CAT_KEYS = ['place','time','verb','art','other'];
// Интервалы повторения (дни) по «коробкам» Лейтнера. Стартовая схема, не из источника; можно менять.
var INTERVALS = [0, 1, 2, 4, 7, 14, 30];
var MASTERED_BOX = 4;
var Q = window.QUESTIONS || [];
var K = window.CARDS || [];
var ALL = Q.concat(K);
var BYID = {};
ALL.forEach(function (x) { BYID[x.id] = x; });
var storageOk = true;

/* ================= Даты ================= */
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return ymd(new Date()); }
function parse(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
function isoWeek(s) {
  var l = parse(s);
  var d = new Date(Date.UTC(l.getFullYear(), l.getMonth(), l.getDate()));
  var dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  var w = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
  return d.getUTCFullYear() + '-W' + pad(w);
}

/* ================= Состояние ================= */
function fresh() { return {v:1, items:{}, log:[], sessions:[], settings:{size:5, cat:'all', tipHidden:false}}; }
function load() {
  try {
    var r = localStorage.getItem(KEY);
    if (r) {
      var s = JSON.parse(r);
      if (s && s.v === 1) {
        s.items = s.items || {}; s.log = s.log || []; s.sessions = s.sessions || [];
        s.settings = Object.assign(fresh().settings, s.settings || {});
        return s;
      }
    }
  } catch (e) { storageOk = false; }
  return fresh();
}
function save() {
  var cut = addDays(today(), -120);
  S.log = S.log.filter(function (x) { return x.d >= cut; });
  S.sessions = S.sessions.filter(function (x) { return x.d >= cut; });
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storageOk = false; }
}
try { localStorage.setItem(KEY + '-t', '1'); localStorage.removeItem(KEY + '-t'); } catch (e) { storageOk = false; }
var S = load();

/* ================= Утилиты DOM ================= */
function h(tag, attrs) {
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  });
  for (var i = 2; i < arguments.length; i++) append(e, arguments[i]);
  return e;
}
function append(e, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { append(e, x); }); return; }
  e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
}
var app = document.getElementById('app');
function show(node) { app.replaceChildren(node); window.scrollTo(0, 0); }
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function label(o) { return o === '—' ? '— (без предлога)' : o; }
function fill(q, opt) {
  if (opt === '—') return q.replace(/ ?___/, '').replace(/\s+/g, ' ').trim();
  return q.replace('___', opt);
}
function sentence(q, fillText, cls) {
  var parts = q.split('___');
  return [parts[0], h('span', {class: 'blank' + (cls ? ' ' + cls : '')}, fillText || '＿＿'), parts[1] || ''];
}
function copyFrom(ta, btn) {
  var done = function () { var old = btn.textContent; btn.textContent = 'Скопировано ✓'; setTimeout(function () { btn.textContent = old; }, 1600); };
  var fallback = function () {
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    try { if (document.execCommand('copy')) done(); } catch (e) {}
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, fallback);
  else fallback();
}

/* ================= Статистика ================= */
function streakInfo() {
  var t = today(), days = {};
  S.sessions.forEach(function (x) { days[x.d] = true; });
  var d = days[t] ? t : addDays(t, -1), n = 0;
  while (days[d]) { n++; d = addDays(d, -1); }
  return n;
}
function accByCat(daysBack) {
  var from = addDays(today(), -(daysBack - 1)), r = {};
  CAT_KEYS.forEach(function (k) { r[k] = {n: 0, ok: 0}; });
  S.log.forEach(function (x) {
    if (x.d < from) return;
    var it = BYID[x.id]; if (!it) return;
    r[it.cat].n++; r[it.cat].ok += x.ok;
  });
  return r;
}

/* ================= Главный экран ================= */
function home() {
  var t = today();
  var sessToday = S.sessions.filter(function (x) { return x.d === t; }).length;
  var mastered = ALL.filter(function (x) { return S.items[x.id] && S.items[x.id].box >= MASTERED_BOX; }).length;
  var acc = accByCat(14);
  var dueCount = ALL.filter(function (x) { return S.items[x.id] && S.items[x.id].seen > 0 && S.items[x.id].due <= t; }).length;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

  var root = h('div', null,
    h('h1', null, 'Preposizioni'),
    h('div', {class: 'sub'}, 'предлоги · 5 вопросов — это уже занятие'),
    !storageOk ? h('div', {class: 'warn'}, 'Браузер не разрешает сохранять прогресс. Занимайся, но статистика пропадёт при закрытии.') : null,
    (isIOS && !standalone && !S.settings.tipHidden) ? h('div', {class: 'tip'},
      h('button', {'aria-label': 'Скрыть', onclick: function () { S.settings.tipHidden = true; save(); home(); }}, '×'),
      'Чтобы открывать как приложение: «Поделиться» → «На экран “Домой”».') : null,
    h('div', {class: 'row'},
      stat(streakInfo(), 'дней подряд'),
      stat(sessToday, 'подходов сегодня'),
      stat(mastered + '/' + ALL.length, 'освоено')),
    h('h2', null, 'Тема'),
    h('div', {class: 'chips'},
      chip('all', 'Все'),
      CAT_KEYS.map(function (k) { return chip(k, CAT[k]); })),
    h('button', {class: 'big', onclick: function () { startSession('quiz'); }},
      'Вопросы', h('small', null, S.settings.size + ' штук · выбери предлог')),
    h('button', {class: 'big alt', onclick: function () { startSession('cards'); }},
      'Карточки', h('small', null, S.settings.size + ' штук · блоки «слово + предлог»')),
    dueCount ? h('div', {class: 'note'}, 'К повторению сегодня: ' + dueCount) : null,
    h('h2', null, 'Как идёт (14 дней)'),
    CAT_KEYS.map(function (k) {
      var a = acc[k], p = a.n ? Math.round(100 * a.ok / a.n) : 0;
      return h('div', {class: 'bar'},
        h('div', {class: 'lab'}, h('span', null, CAT[k]), h('span', null, a.n ? p + '% · ответов: ' + a.n : 'пока нет данных')),
        h('div', {class: 'tr'}, h('div', {class: 'fl', style: 'width:' + p + '%'})));
    }),
    h('div', {class: 'links'},
      h('button', {class: 'link', onclick: reportView}, 'Отчёт недели'),
      h('button', {class: 'link', onclick: backupView}, 'Резервная копия'),
      h('button', {class: 'link', onclick: settingsView}, 'Настройки')),
    h('footer', null, 'v' + VERSION + ' · вопросов: ' + Q.length + ' · карточек: ' + K.length)
  );
  show(root);
}
function stat(v, l) { return h('div', {class: 'stat'}, h('b', null, v), h('span', null, l)); }
function chip(key, text) {
  return h('button', {class: 'chip' + (S.settings.cat === key ? ' on' : ''), onclick: function () { S.settings.cat = key; save(); home(); }}, text);
}

/* ================= Подбор вопросов ================= */
function buildQueue(mode) {
  var t = today(), size = S.settings.size;
  var pool = (mode === 'quiz' ? Q : K).filter(function (x) { return S.settings.cat === 'all' || x.cat === S.settings.cat; });
  shuffle(pool);
  var st = function (x) { return S.items[x.id]; };
  var due = pool.filter(function (x) { return st(x) && st(x).seen > 0 && st(x).due <= t; })
                .sort(function (a, b) { return st(a).due < st(b).due ? -1 : st(a).due > st(b).due ? 1 : 0; });
  var fresh_ = pool.filter(function (x) { return !st(x) || st(x).seen === 0; });
  var rest = pool.filter(function (x) { return st(x) && st(x).seen > 0 && st(x).due > t; })
                 .sort(function (a, b) { return st(a).due < st(b).due ? -1 : st(a).due > st(b).due ? 1 : 0; });
  return due.concat(fresh_).concat(rest).slice(0, size);
}

/* ================= Сессия ================= */
var ses = null;
function startSession(mode) {
  var q = buildQueue(mode);
  if (!q.length) { home(); return; }
  ses = {mode: mode, list: q.map(function (x) { return {it: x, retry: false}; }), i: 0, total: q.length, ok: 0, wrong: []};
  step();
}
function step() {
  if (ses.i >= ses.list.length) return finish();
  var e = ses.list[ses.i];
  if (ses.mode === 'quiz') renderQuiz(e); else renderCard(e);
}
function topBar() {
  var e = ses.list[ses.i];
  var txt = e.retry ? 'повтор ошибки' : (Math.min(ses.i + 1, ses.total) + ' / ' + ses.total);
  return h('div', {class: 'top'},
    h('button', {class: 'back', onclick: function () { ses = null; home(); }}, '‹ Домой'),
    h('span', null, txt));
}
function record(it, ok, chosen, retry) {
  var t = today();
  var s = S.items[it.id] || (S.items[it.id] = {box: 0, due: t, seen: 0, wrong: 0});
  if (retry) {
    // повтор после ошибки в этом же подходе: не пишем в журнал, лишь закрепляем
    if (ok) { s.box = 1; s.due = addDays(t, INTERVALS[1]); }
    return;
  }
  s.seen++;
  if (ok) { s.box = Math.min(s.box + 1, INTERVALS.length - 1); s.due = addDays(t, INTERVALS[s.box]); }
  else { s.wrong++; s.box = 0; s.due = t; s.lw = chosen == null ? '' : chosen; }
  S.log.push({d: t, id: it.id, ok: ok ? 1 : 0});
}
function afterAnswer(entry, ok, chosen) {
  record(entry.it, ok, chosen, entry.retry);
  if (!entry.retry) {
    if (ok) ses.ok++;
    else { ses.wrong.push(entry.it); ses.list.push({it: entry.it, retry: true}); }
  }
  save();
}

function renderQuiz(entry) {
  var it = entry.it, answered = false;
  var opts = shuffle(it.o.slice());
  var sent = h('div', {class: 'it'}, sentence(it.q));
  var fb = h('div');
  var buttons = opts.map(function (o) {
    return h('button', {class: 'opt', 'data-o': o, onclick: function () { choose(o); }}, label(o));
  });
  function choose(o) {
    if (answered) return; answered = true;
    var ok = o === it.a;
    buttons.forEach(function (b) {
      b.disabled = true;
      var v = b.getAttribute('data-o');
      if (v === it.a) b.classList.add('good'); else if (v === o) b.classList.add('bad');
    });
    sent.replaceChildren.apply(sent, sentence(it.q, it.a, 'good'));  // в пропуске всегда правильный вариант (зелёным)
    fb.replaceChildren(h('div', {class: 'fb ' + (ok ? 'good' : 'bad')},
      h('b', null, ok ? '✓ Верно' : (o === null ? '✗ Правильно так' : '✗ Нужно: ' + label(it.a))),
      it.why,
      h('div', {class: 'note', style: 'margin-top:6px'}, fill(it.q, it.a))),
      h('button', {class: 'big', id: 'next', onclick: function () { ses.i++; step(); }}, 'Дальше'));
    afterAnswer(entry, ok, o);
    var n = document.getElementById('next'); if (n) n.scrollIntoView({block: 'nearest'});
  }
  var dk = h('button', {class: 'ghost', onclick: function () { choose(null); }}, 'Не знаю');
  show(h('div', null, topBar(),
    h('div', {class: 'card'}, h('div', {class: 'ru'}, it.ru), sent, h('div', {class: 'opts'}, buttons), dk, fb)));
}

function renderCard(entry) {
  var it = entry.it;
  var body = h('div');
  var front = h('div', {class: 'card'}, h('div', {class: 'card-front'}, it.f), body);
  body.appendChild(h('button', {class: 'big', onclick: reveal}, 'Показать'));
  function reveal() {
    body.replaceChildren(
      h('div', {class: 'card-back'}, it.b),
      h('div', {class: 'card-ex'}, it.ex),
      h('div', {class: 'two'},
        h('button', {class: 'no', onclick: function () { rate(false); }}, 'Не знала'),
        h('button', {class: 'yes', onclick: function () { rate(true); }}, 'Знала')));
  }
  function rate(ok) { afterAnswer(entry, ok, null); ses.i++; step(); }
  show(h('div', null, topBar(), front));
}

function finish() {
  var s = ses; ses = null;
  S.sessions.push({d: today(), mode: s.mode, n: s.total, ok: s.ok});
  save();
  var uniq = [];
  s.wrong.forEach(function (x) { if (uniq.indexOf(x) < 0) uniq.push(x); });
  show(h('div', null,
    h('h1', null, 'Готово'),
    h('div', {class: 'res'}, s.ok + ' из ' + s.total),
    h('div', {class: 'sub', style: 'text-align:center'}, 'с первого раза · серия: ' + streakInfo() + ' дн.'),
    uniq.length ? h('h2', null, 'Запомни') : null,
    uniq.map(function (x) {
      return h('div', {class: 'mist'}, s.mode === 'quiz'
        ? [h('i', null, fill(x.q, x.a)), h('div', {class: 'note'}, x.why)]
        : [x.f + ' → ', h('i', null, x.b)]);
    }),
    h('button', {class: 'big', onclick: function () { startSession(s.mode); }}, 'Ещё подход'),
    h('button', {class: 'big alt', onclick: home}, 'Домой')));
}

/* ================= Отчёт недели ================= */
function weekReportText() {
  var t = today(), from = addDays(t, -6);
  var log = S.log.filter(function (x) { return x.d >= from && x.d <= t; });
  var sess = S.sessions.filter(function (x) { return x.d >= from && x.d <= t; });
  var week = isoWeek(t);
  var head = '## Тренажёр: ' + week + ' (' + from + ' — ' + t + ')\n';
  if (!log.length) return head + '\nЗа эти 7 дней занятий нет.\n';
  var total = log.length, ok = log.reduce(function (a, x) { return a + x.ok; }, 0);
  var by = {}; CAT_KEYS.forEach(function (k) { by[k] = {n: 0, ok: 0}; });
  var miss = {};
  log.forEach(function (x) {
    var it = BYID[x.id]; if (!it) return;
    by[it.cat].n++; by[it.cat].ok += x.ok;
    if (!x.ok) miss[x.id] = (miss[x.id] || 0) + 1;
  });
  var out = head + '\n[week:: ' + week + '] [sessions:: ' + sess.length + '] [answers:: ' + total + '] [correct:: ' + ok +
    '] [acc:: ' + Math.round(100 * ok / total) + ']\n\n| Категория | Ответов | Верно | % |\n|---|---|---|---|\n';
  CAT_KEYS.forEach(function (k) {
    var a = by[k]; if (!a.n) return;
    out += '| ' + CAT_LOW[k] + ' | ' + a.n + ' | ' + a.ok + ' | ' + Math.round(100 * a.ok / a.n) + ' |\n';
  });
  var ids = Object.keys(miss).sort(function (a, b) { return miss[b] - miss[a]; }).slice(0, 10);
  if (ids.length) {
    out += '\n### Ошибки недели (вставить в журнал)\n\n';
    ids.forEach(function (id) {
      var it = BYID[id], s = S.items[id] || {};
      var line = '- ';
      if (it.q) {
        var was = (s.lw === undefined || s.lw === '') ? 'не знала' : '«' + fill(it.q, s.lw) + '»';
        line += 'Было: ' + was + ' → Надо: «' + fill(it.q, it.a) + '» · Почему: ' + it.why;
      } else {
        line += 'Карточка: «' + it.f + '» → «' + it.b + '» · Пример: ' + it.ex;
      }
      // поля Dataview ставим в конце строки, в квадратных скобках (так их читает Dataview)
      line += ' [cat:: ' + CAT_LOW[it.cat] + '] [src:: тренажёр] [miss:: ' + miss[id] + ']';
      out += line + '\n';
    });
  }
  return out;
}
function reportView() {
  var ta = h('textarea', {readonly: 'readonly'}); ta.value = weekReportText();
  var btn = h('button', {class: 'big', onclick: function () { copyFrom(ta, btn); }}, 'Скопировать');
  show(h('div', null,
    h('div', {class: 'top'}, h('button', {class: 'back', onclick: home}, '‹ Домой'), h('span')),
    h('h1', null, 'Отчёт недели'),
    h('div', {class: 'sub'}, 'Раз в неделю: скопируй и вставь в заметку недели в Obsidian на ноутбуке (отправь себе в мессенджер или на почту).'),
    ta, btn));
}

/* ================= Резервная копия ================= */
function backupView() {
  var ta = h('textarea', {readonly: 'readonly'}); ta.value = JSON.stringify(S);
  var cb = h('button', {class: 'big', onclick: function () { copyFrom(ta, cb); }}, 'Скопировать копию');
  var inp = h('textarea', {placeholder: 'Вставь сюда ранее скопированную копию'});
  var msg = h('div', {class: 'note'});
  var rb = h('button', {class: 'big alt', onclick: function () {
    var txt = inp.value.trim(); if (!txt) return;
    var obj;
    try { obj = JSON.parse(txt); } catch (e) { msg.textContent = 'Это не похоже на копию (ошибка чтения).'; return; }
    if (!obj || obj.v !== 1 || !obj.items) { msg.textContent = 'Это не похоже на копию тренажёра.'; return; }
    if (rb.getAttribute('data-sure') !== '1') { rb.setAttribute('data-sure', '1'); rb.firstChild.nodeValue = 'Точно заменить текущий прогресс?'; return; }
    S = obj; S.log = S.log || []; S.sessions = S.sessions || []; S.settings = Object.assign(fresh().settings, S.settings || {});
    save(); home();
  }}, 'Восстановить из копии');
  show(h('div', null,
    h('div', {class: 'top'}, h('button', {class: 'back', onclick: home}, '‹ Домой'), h('span')),
    h('h1', null, 'Резервная копия'),
    h('div', {class: 'sub'}, 'Прогресс хранится только в этом телефоне. Скопируй и сохрани в заметку или отправь себе — тогда его можно вернуть, если данные пропадут.'),
    ta, cb, h('h2', null, 'Восстановление'), inp, rb, msg));
}

/* ================= Настройки ================= */
function settingsView() {
  var seg = h('div', {class: 'seg'}, [5, 10, 15].map(function (n) {
    return h('button', {class: S.settings.size === n ? 'on' : '', onclick: function () { S.settings.size = n; save(); settingsView(); }}, String(n));
  }));
  var rst = h('button', {class: 'big alt', onclick: function () {
    if (rst.getAttribute('data-sure') !== '1') { rst.setAttribute('data-sure', '1'); rst.firstChild.nodeValue = 'Точно стереть весь прогресс?'; return; }
    S = fresh(); save(); home();
  }}, 'Стереть прогресс');
  show(h('div', null,
    h('div', {class: 'top'}, h('button', {class: 'back', onclick: home}, '‹ Домой'), h('span')),
    h('h1', null, 'Настройки'),
    h('h2', null, 'Заданий в подходе'), seg,
    h('h2', null, 'Прогресс'),
    h('div', {class: 'note'}, 'Перед стиранием лучше сделать резервную копию.'),
    rst));
}

/* ================= Старт ================= */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
home();
})();
