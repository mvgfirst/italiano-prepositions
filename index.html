<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Предлоги">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f5f8b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Preposizioni</title>
<style>
:root{
  --bg:#f4f7fa; --card:#ffffff; --fg:#17212b; --muted:#5d6b78; --line:#d5dee6;
  --acc:#1f5f8b; --acc-fg:#ffffff; --acc-soft:#e3eef6;
  --ok:#1b7a3d; --ok-soft:#dff3e6; --bad:#b3261e; --bad-soft:#fbe4e2; --it:#a3261f;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10161c; --card:#19222b; --fg:#e8eef3; --muted:#9aa9b6; --line:#2c3a46;
    --acc:#5aa5d6; --acc-fg:#0b1a24; --acc-soft:#1c2d3b;
    --ok:#5fd18a; --ok-soft:#173a26; --bad:#ff8a80; --bad-soft:#40201e; --it:#ff9d94;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:520px;margin:0 auto;padding:16px 16px 40px}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
h1{font-size:26px;margin:4px 0 0}
h2{font-size:18px;margin:22px 0 8px}
.sub{color:var(--muted);font-size:15px;margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px}
.stat{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:15px}
.chip.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.big{display:block;width:100%;border:0;border-radius:16px;padding:18px;margin:10px 0;font-size:19px;font-weight:600;
  background:var(--acc);color:var(--acc-fg)}
.big.alt{background:var(--card);color:var(--fg);border:1px solid var(--acc)}
.big small{display:block;font-weight:400;font-size:14px;opacity:.85;margin-top:2px}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:22px}
.link{background:none;border:0;color:var(--acc);padding:6px 0;font-size:16px;text-decoration:underline}
.bar{margin:8px 0}
.bar .lab{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.bar .tr{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:3px}
.bar .fl{height:100%;background:var(--acc)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;color:var(--muted);font-size:15px}
.back{background:none;border:0;color:var(--acc);font-size:17px;padding:6px 0}
.ru{color:var(--muted);font-size:17px;margin-bottom:10px}
.it{font-size:25px;line-height:1.3;margin:6px 0 16px;color:var(--it);font-style:italic;word-break:break-word}
.blank{display:inline-block;min-width:52px;text-align:center;border-bottom:3px solid var(--acc);color:var(--acc);font-weight:700;font-style:normal;padding:0 4px}
.blank.good{color:var(--ok);border-color:var(--ok)}
.blank.bad{color:var(--bad);border-color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:16px 8px;font-size:20px;font-weight:600}
.opt.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.ghost{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font-size:16px;padding:8px 14px}
.fb{margin-top:14px;padding:12px;border-radius:12px;font-size:16px}
.fb.good{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:4px}
.card-front{font-size:28px;text-align:center;padding:34px 8px}
.card-back{font-size:26px;text-align:center;color:var(--it);font-style:italic;padding:8px}
.card-ex{font-size:18px;text-align:center;color:var(--muted);font-style:italic;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.two button{border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:600}
.no{background:var(--bad-soft);color:var(--bad)} .yes{background:var(--ok-soft);color:var(--ok)}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);
  padding:10px;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}
.note{color:var(--muted);font-size:14px}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.tip{background:var(--acc-soft);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.tip .link{float:none;margin:0;font-size:15px;padding:0}
.tip button:not(.link){float:right;background:none;border:0;color:var(--muted);font-size:20px;line-height:1;margin:-4px -4px 0 8px}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;font-size:17px}
.seg button.on{background:var(--acc);color:var(--acc-fg);border-color:var(--acc)}
.mist{margin:6px 0;padding:8px 10px;border-radius:10px;background:var(--bad-soft);font-size:16px}
.mist i{color:var(--it)}
.res{font-size:44px;font-weight:700;text-align:center;margin:10px 0 0}
input[type=text]{display:block;width:100%;margin:8px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);padding:12px;font:inherit;font-size:17px}
.why{margin-top:10px}
footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script src="engine.js"></script>
<script>
(function () {
'use strict';

/* ================= Константы ================= */
var E = window.Engine;
var VERSION = '2.0';
var BUILTIN_PACKS = ['packs/preposizioni.json'];   // встроенные пакеты (кэшируются service worker'ом)
var CAT = E.TOPICS, CAT_LOW = E.TOPIC_LOW, CAT_KEYS = E.TOPIC_KEYS;
var CATALOG = {items: [], byKey: {}, packs: [], rejected: []};
var BUILTIN_RAW = [], BUILTIN_BAD = 0;
var storageOk = true;
var S = E.freshState();

function today() { return E.ymd(new Date()); }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function why(k) { return cap(CAT_LOW[k]); }

/* ================= Состояние и пакеты ================= */
function save() { if (!E.saveState(localStorage, S, today())) storageOk = false; }
function importedRaw() { return E.loadImportedPacks(localStorage); }
function importedIds() { return importedRaw().map(function (p) { return p && p.packId; }); }
function rebuildCatalog() {
  CATALOG = E.buildCatalog(BUILTIN_RAW.concat(importedRaw()));
  for (var i = 0; i < BUILTIN_BAD; i++) CATALOG.rejected.push({packId: '?', errors: ['не загрузился файл пакета']});
  if (S.settings.pack !== 'all' && !CATALOG.packs.some(function (p) { return p.packId === S.settings.pack; })) S.settings.pack = 'all';
}
/* Действующие пакеты целиком (лучшая версия каждого, только годные): для копии и для правил обновления. */
function activeRaw() {
  var best = {};
  BUILTIN_RAW.concat(importedRaw()).forEach(function (p) {
    if (!p || E.validatePack(p).length) return;
    if (!best[p.packId] || best[p.packId].version < p.version) best[p.packId] = p;
  });
  return Object.keys(best).map(function (k) { return best[k]; });
}

/* ================= Утилиты DOM ================= */
function h(tag, attrs) {
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  });
  for (var i = 2; i < arguments.length; i++) append(e, arguments[i]);
  return e;
}
function append(e, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { append(e, x); }); return; }
  e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
}
var app = document.getElementById('app');
function show(node) { app.replaceChildren(node); window.scrollTo(0, 0); }
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function label(o) { return o === '—' ? '— (без предлога)' : o; }
function sentence(q, fillText, cls) {
  var parts = q.split('___');
  return [parts[0], h('span', {class: 'blank' + (cls ? ' ' + cls : '')}, fillText || '＿＿'), parts[1] || ''];
}
function copyFrom(ta, btn) {
  var done = function () { var old = btn.textContent; btn.textContent = 'Скопировано ✓'; setTimeout(function () { btn.textContent = old; }, 1600); };
  var fallback = function () {
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    try { if (document.execCommand('copy')) done(); } catch (e) {}
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, fallback);
  else fallback();
}
function countType(type) {
  return CATALOG.items.filter(function (x) { return x.type === type && E.isActive(S, x); }).length;
}
function backBar(fn) { return h('div', {class: 'top'}, h('button', {class: 'back', onclick: fn || home}, '‹ Домой'), h('span')); }
function itemText(x) { return x.type === 'gap' ? E.fill(x.q, x.answer) : x.front + ' → ' + x.back; }

/* ================= Главный экран ================= */
function reviewCount() {
  return E.weekErrors(CATALOG, S, today(), 7).app.filter(function (r) { return r.active; }).length;
}
function home() {
  var t = today();
  var sessToday = S.sessions.filter(function (x) { return x.d === t; }).length;
  var m = E.masteredCount(CATALOG, S);
  var acc = E.accByTopic(CATALOG, S, 14, t);
  var dueCount = E.dueCount(CATALOG, S, t);
  var rev = reviewCount();
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);

  var root = h('div', null,
    h('h1', null, 'Preposizioni'),
    h('div', {class: 'sub'}, '5 вопросов — это уже занятие'),
    !storageOk ? h('div', {class: 'warn'}, 'Браузер не разрешает сохранять прогресс. Занимайся, но статистика пропадёт при закрытии.') : null,
    CATALOG.rejected.length ? h('div', {class: 'warn'}, 'Часть материалов не загрузилась (пакетов с ошибками: ' + CATALOG.rejected.length + '). Остальное работает.') : null,
    E.backupNudge(S, t) ? h('div', {class: 'tip', 'data-role': 'nudge'}, 'Резервной копии давно не было. ', h('button', {class: 'link', onclick: backupView}, 'Сделать копию')) : null,
    (isIOS && !standalone && !S.settings.tipHidden) ? h('div', {class: 'tip'},
      h('button', {'aria-label': 'Скрыть', onclick: function () { S.settings.tipHidden = true; save(); home(); }}, '×'),
      'Чтобы открывать как приложение: «Поделиться» → «На экран “Домой”».') : null,
    h('div', {class: 'row'},
      stat(E.streak(S, t), 'дней подряд'),
      stat(sessToday, 'подходов сегодня'),
      stat(m.mastered + '/' + m.total, 'освоено')),
    CATALOG.packs.length > 1 ? [
      h('h2', null, 'Пакет'),
      h('div', {class: 'chips'},
        packChip('all', 'Все'),
        CATALOG.packs.map(function (p) { return packChip(p.packId, p.title); }))] : null,
    h('h2', null, 'Тема'),
    h('div', {class: 'chips'},
      chip('all', 'Все'),
      CAT_KEYS.map(function (k) { return chip(k, CAT[k]); })),
    h('button', {class: 'big', onclick: function () { startSession('gap'); }},
      'Вопросы', h('small', null, S.settings.size + ' штук · выбери предлог')),
    h('button', {class: 'big alt', onclick: function () { startSession('card'); }},
      'Карточки', h('small', null, S.settings.size + ' штук · блоки «слово + предлог»')),
    rev ? h('button', {class: 'big alt', 'data-role': 'review', onclick: startReview},
      'Разбор недели', h('small', null, 'ошибки за 7 дней · пунктов: ' + rev)) : null,
    dueCount ? h('div', {class: 'note'}, 'К повторению сегодня: ' + dueCount) : null,
    h('h2', null, 'Как идёт (14 дней)'),
    CAT_KEYS.map(function (k) {
      var a = acc[k], p = a.n ? Math.round(100 * a.ok / a.n) : 0;
      return h('div', {class: 'bar'},
        h('div', {class: 'lab'}, h('span', null, CAT[k]), h('span', null, a.n ? p + '% · ответов: ' + a.n : 'пока нет данных')),
        h('div', {class: 'tr'}, h('div', {class: 'fl', style: 'width:' + p + '%'})));
    }),
    h('div', {class: 'links'},
      h('button', {class: 'link', onclick: function () { errorsView(); }}, 'Тетрадь ошибок'),
      h('button', {class: 'link', 'data-role': 'journal', onclick: function () { journalView(0); }}, 'Журнал для Obsidian'),
      h('button', {class: 'link', onclick: backupView}, 'Резервная копия'),
      h('button', {class: 'link', onclick: settingsView}, 'Настройки')),
    h('footer', null, 'v' + VERSION + ' · вопросов: ' + countType('gap') + ' · карточек: ' + countType('card'))
  );
  show(root);
}
function stat(v, l) { return h('div', {class: 'stat'}, h('b', null, v), h('span', null, l)); }
function chip(key, text) {
  return h('button', {class: 'chip' + (S.settings.cat === key ? ' on' : ''), onclick: function () { S.settings.cat = key; save(); home(); }}, text);
}
function packChip(key, text) {
  return h('button', {class: 'chip' + (S.settings.pack === key ? ' on' : ''), 'data-pack': key, onclick: function () { S.settings.pack = key; save(); home(); }}, text);
}

/* ================= Сессия ================= */
var ses = null;
function startSession(mode) {
  var q = E.buildQueue(CATALOG, S, mode, today());
  if (!q.length) { home(); return; }
  beginSession(mode, q);
}
function startReview() {
  var q = E.buildReviewQueue(CATALOG, S, today());
  if (!q.length) { home(); return; }
  beginSession('review', q);
}
function beginSession(mode, q) {
  ses = {mode: mode, list: q.map(function (x) { return {it: x, retry: false}; }), i: 0, total: q.length, ok: 0, wrong: []};
  step();
}
function step() {
  if (ses.i >= ses.list.length) return finish();
  var e = ses.list[ses.i];
  if (e.it.type === 'gap') renderQuiz(e); else renderCard(e);
}
function topBar() {
  var e = ses.list[ses.i];
  var txt = e.retry ? 'повтор ошибки' : (ses.mode === 'review' ? 'разбор · ' : '') + (Math.min(ses.i + 1, ses.total) + ' / ' + ses.total);
  return h('div', {class: 'top'},
    h('button', {class: 'back', onclick: function () { ses = null; home(); }}, '‹ Домой'),
    h('span', null, txt));
}
function afterAnswer(entry, ok, chosen) {
  var ev = E.recordAnswer(S, entry.it, ok, chosen, entry.retry, today(), Date.now());
  if (!entry.retry) {
    if (ok) ses.ok++;
    else { ses.wrong.push(entry.it); ses.list.push({it: entry.it, retry: true}); }
  }
  save();
  return ev;
}
/* «Сомневаюсь» (не уверена, что пункт правильный) и «Рано» (ещё не проходила): оба убирают пункт из занятий, статистика остаётся.
 * Вернуть можно в Настройках; «Рано» собирается отдельным списком «на потом». */
function flagButtons(it) {
  function mk(role, text, doneText, fn) {
    var b = h('button', {class: 'ghost', 'data-role': role, onclick: function () {
      fn(S, it.key, true, today()); save();
      b.disabled = true; b.textContent = doneText;
    }}, text);
    return b;
  }
  var d = mk('doubt', 'Сомневаюсь в этом пункте', 'Убрано из занятий ✓ (вернуть: Настройки)', E.setDoubt);
  var r = mk('early', 'Рано: ещё не проходила', 'Отложено «на потом» ✓ (вернуть: Настройки)', E.setEarly);
  d.addEventListener('click', function () { r.style.display = 'none'; });
  r.addEventListener('click', function () { d.style.display = 'none'; });
  return h('div', null, d, r);
}
/* «Почему?»: после ошибки одна строка кнопок, можно пропустить (просто «Дальше»). Повторное нажатие на выбранную причину стирает её. */
function whyRow(ev) {
  var row = h('div', {class: 'why', 'data-role': 'why'}, h('div', {class: 'note'}, 'Почему ошиблась?'));
  var chips = h('div', {class: 'chips'});
  CAT_KEYS.forEach(function (k) {
    var b = h('button', {class: 'chip', 'data-why': k, onclick: function () {
      var on = ev.why === k;
      E.setWhy(S, ev, on ? null : k); save();
      Array.prototype.forEach.call(chips.children, function (c) { c.classList.toggle('on', c.getAttribute('data-why') === ev.why); });
    }}, why(k));
    chips.appendChild(b);
  });
  row.appendChild(chips);
  return row;
}

function renderQuiz(entry) {
  var it = entry.it, answered = false;
  var opts = shuffle(it.options.slice());
  var sent = h('div', {class: 'it'}, sentence(it.q));
  var fb = h('div');
  var buttons = opts.map(function (o) {
    return h('button', {class: 'opt', 'data-o': o, onclick: function () { choose(o); }}, label(o));
  });
  function choose(o) {
    if (answered) return; answered = true;
    var ok = o === it.answer;
    buttons.forEach(function (b) {
      b.disabled = true;
      var v = b.getAttribute('data-o');
      if (v === it.answer) b.classList.add('good'); else if (v === o) b.classList.add('bad');
    });
    sent.replaceChildren.apply(sent, sentence(it.q, it.answer, 'good'));
    var ev = afterAnswer(entry, ok, o);
    /* replaceChildren превращает null в текст «null» (в отличие от h()), поэтому пустые узлы отфильтрованы */
    fb.replaceChildren.apply(fb, [h('div', {class: 'fb ' + (ok ? 'good' : 'bad')},
      h('b', null, ok ? '✓ Верно' : (o === null ? '✗ Правильно так' : '✗ Нужно: ' + label(it.answer))),
      it.why,
      h('div', {class: 'note', style: 'margin-top:6px'}, E.fill(it.q, it.answer))),
      (!ok && ev) ? whyRow(ev) : null,
      h('button', {class: 'big', id: 'next', onclick: function () { ses.i++; step(); }}, 'Дальше'),
      flagButtons(it)].filter(Boolean));
    var n = document.getElementById('next'); if (n) n.scrollIntoView({block: 'nearest'});
  }
  var dk = h('button', {class: 'ghost', onclick: function () { choose(null); }}, 'Не знаю');
  show(h('div', null, topBar(),
    h('div', {class: 'card'}, h('div', {class: 'ru'}, it.ru), sent, h('div', {class: 'opts'}, buttons), dk, fb)));
}

function renderCard(entry) {
  var it = entry.it;
  var body = h('div');
  var front = h('div', {class: 'card'}, h('div', {class: 'card-front'}, it.front), body);
  body.appendChild(h('button', {class: 'big', onclick: reveal}, 'Показать'));
  function reveal() {
    body.replaceChildren(
      h('div', {class: 'card-back'}, it.back),
      h('div', {class: 'card-ex'}, it.example),
      h('div', {class: 'two'},
        h('button', {class: 'no', onclick: function () { rate(false); }}, 'Не знала'),
        h('button', {class: 'yes', onclick: function () { rate(true); }}, 'Знала')),
      flagButtons(it));
  }
  function rate(ok) { afterAnswer(entry, ok, null); ses.i++; step(); }
  show(h('div', null, topBar(), front));
}

function finish() {
  var s = ses; ses = null;
  S.sessions.push({d: today(), mode: s.mode === 'gap' ? 'quiz' : s.mode === 'card' ? 'cards' : 'review', n: s.total, ok: s.ok});
  save();
  var uniq = [];
  s.wrong.forEach(function (x) { if (uniq.indexOf(x) < 0) uniq.push(x); });
  show(h('div', null,
    h('h1', null, 'Готово'),
    h('div', {class: 'res'}, s.ok + ' из ' + s.total),
    h('div', {class: 'sub', style: 'text-align:center'}, 'с первого раза · серия: ' + E.streak(S, today()) + ' дн.'),
    uniq.length ? h('h2', null, 'Запомни') : null,
    uniq.map(function (x) {
      return h('div', {class: 'mist'}, x.type === 'gap'
        ? [h('i', null, E.fill(x.q, x.answer)), h('div', {class: 'note'}, x.why)]
        : [x.front + ' → ', h('i', null, x.back)]);
    }),
    h('button', {class: 'big', onclick: function () { if (s.mode === 'review') startReview(); else startSession(s.mode); }}, 'Ещё подход'),
    h('button', {class: 'big alt', onclick: home}, 'Домой')));
}

/* ================= Тетрадь ошибок ================= */
function errorsView(flash) {
  var w = E.weekErrors(CATALOG, S, today(), 7);
  var rev = reviewCount();
  var cnt = {};
  w.app.forEach(function (r) { cnt[r.cat] = (cnt[r.cat] || 0) + r.miss; });
  w.lesson.forEach(function (r) { cnt[r.cat] = (cnt[r.cat] || 0) + 1; });
  var sum = CAT_KEYS.filter(function (k) { return cnt[k]; }).map(function (k) { return why(k) + ': ' + cnt[k]; });
  show(h('div', null, backBar(),
    h('h1', null, 'Тетрадь ошибок'),
    h('div', {class: 'sub'}, 'за 7 дней'),
    flash ? h('div', {class: 'tip'}, flash) : null,
    sum.length ? h('div', {class: 'note', 'data-role': 'sum'}, sum.join(' · ')) : null,
    rev ? h('button', {class: 'big', 'data-role': 'review', onclick: startReview}, 'Разбор недели', h('small', null, 'пунктов: ' + rev)) : null,
    h('button', {class: 'big alt', 'data-role': 'add-lesson', onclick: function () { lessonView(); }}, '+ Ошибка с урока', h('small', null, 'ошибка не из тренажёра: было → надо')),
    h('h2', null, 'В тренажёре (' + w.app.length + ')'),
    w.app.length ? w.app.map(function (r) {
      var it = r.it;
      var main = it.type === 'gap'
        ? ['Было: ' + (r.ch == null ? 'не знала' : '«' + E.fill(it.q, r.ch) + '»'), ' → Надо: «' + E.fill(it.q, it.answer) + '»']
        : [it.front + ' → ', h('i', null, it.back)];
      return h('div', {class: 'mist', 'data-role': 'err'}, h('div', null, main),
        h('div', {class: 'note'}, why(r.cat) + (r.why ? ' (причина)' : ' (тема)') + ' · ошибок: ' + r.miss + (r.active ? '' : ' · убрано из занятий')));
    }) : h('div', {class: 'note'}, 'Ошибок за неделю нет.'),
    h('h2', null, 'С уроков (' + w.lesson.length + ')'),
    w.lesson.length ? w.lesson.map(function (r) {
      return h('div', {class: 'mist', 'data-role': 'lesson-err'}, h('div', null, 'Было: «' + r.was + '» → Надо: «' + r.should + '»'),
        h('div', {class: 'note'}, why(r.cat) + ' · ' + r.d + (r.note ? ' · ' + r.note : '')));
    }) : h('div', {class: 'note'}, 'Пока пусто. Сюда можно записать ошибку, которую ты сделала на уроке.')));
}

function lessonView() {
  var cat = 'other', msg = h('div', {class: 'warn', style: 'display:none'});
  var was = h('input', {type: 'text', id: 'l-was', maxlength: String(E.MAX_TEXT), placeholder: 'Как было (что ты сказала или написала)', autocapitalize: 'off', autocomplete: 'off'});
  var should = h('input', {type: 'text', id: 'l-should', maxlength: String(E.MAX_TEXT), placeholder: 'Как правильно', autocapitalize: 'off', autocomplete: 'off'});
  var note = h('input', {type: 'text', id: 'l-note', maxlength: String(E.MAX_TEXT), placeholder: 'Пояснение (необязательно)', autocomplete: 'off'});
  var chips = h('div', {class: 'chips'});
  CAT_KEYS.forEach(function (k) {
    chips.appendChild(h('button', {class: 'chip' + (k === cat ? ' on' : ''), 'data-cat': k, onclick: function () {
      cat = k; Array.prototype.forEach.call(chips.children, function (c) { c.classList.toggle('on', c.getAttribute('data-cat') === k); });
    }}, why(k)));
  });
  show(h('div', null, backBar(function () { errorsView(); }),
    h('h1', null, 'Ошибка с урока'),
    h('div', {class: 'sub'}, 'Одна ошибка — одна запись. Пример: было «vado a Roma da treno» → надо «vado a Roma in treno».'),
    was, should, note,
    h('h2', null, 'Почему?'), chips, msg,
    h('button', {class: 'big', 'data-role': 'save-lesson', onclick: function () {
      var r = E.addLessonError(S, {was: was.value, should: should.value, note: note.value, cat: cat}, today(), Date.now());
      if (!r.ok) { msg.style.display = ''; msg.textContent = 'Не записано: ' + r.error + '.'; return; }
      save(); errorsView('Записано ✓');
    }}, 'Записать')));
}

/* ================= Журнал для Obsidian ================= */
function journalView(offset) {
  var msg = h('div', {class: 'note', 'data-role': 'msg', style: 'margin:8px 0'});
  var rng = E.weekRange(today(), offset);
  var j = E.journalMd(CATALOG, S, rng, today());
  var box = h('div');
  var chips = h('div', {class: 'chips'},
    h('button', {class: 'chip' + (offset === 0 ? ' on' : ''), 'data-role': 'week-0', onclick: function () { journalView(0); }}, 'Эта неделя'),
    h('button', {class: 'chip' + (offset === -1 ? ' on' : ''), 'data-role': 'week--1', onclick: function () { journalView(-1); }}, 'Прошлая неделя'));
  var parts = [backBar(),
    h('h1', null, 'Журнал для Obsidian'),
    h('div', {class: 'sub'}, 'Раз в неделю: подготовь файл и отправь его себе в Telegram («Избранное»), на ноутбуке положи в папку «Тренажёр» хранилища Obsidian.'),
    chips,
    h('div', {class: 'note', 'data-role': 'range'}, rng.week + ' · ' + rng.from + ' — ' + rng.to)];
  if (j.empty) {
    parts.push(h('div', {class: 'note', 'data-role': 'empty'}, 'За эту неделю занятий и записанных ошибок нет: файл не нужен.'));
  } else {
    var c = j.counts;
    parts.push(
      h('div', {class: 'note', 'data-role': 'counts'}, 'Подходов: ' + c.sessions + ' · ответов: ' + c.answers + ' · ошибок: ' + c.errors + (c.lesson ? ' · с уроков: ' + c.lesson : '')),
      h('button', {class: 'big', 'data-role': 'make-journal', onclick: function () {
        deliver(new Blob([j.text], {type: 'text/markdown'}), j.name, msg, 'Журнал тренажёра');
      }}, 'Подготовить журнал', h('small', null, 'файл «' + j.name + '»')),
      msg,
      h('button', {class: 'link', 'data-role': 'show-journal', onclick: function () {
        var ta = h('textarea', {readonly: 'readonly', 'data-role': 'journal-text'}); ta.value = j.text;
        var cb = h('button', {class: 'big alt', onclick: function () { copyFrom(ta, cb); }}, 'Скопировать текст');
        box.replaceChildren(ta, cb);
      }}, 'Показать текст (запасной путь)'));
    parts.push(box);
  }
  show(h('div', null, parts));
}

/* ================= Резервная копия: один файл (пакеты + прогресс) ================= */
var useGz = false;
function fileBlob(text) {
  if (useGz && typeof CompressionStream !== 'undefined') {
    return E.textToGzip(text).then(function (buf) { return {blob: new Blob([buf], {type: 'application/gzip'}), ext: '.json.gz'}; });
  }
  return Promise.resolve({blob: new Blob([text], {type: 'application/json'}), ext: '.json'});
}
function deliver(blob, name, msg, title) {
  function download() {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    msg.textContent = 'Файл «' + name + '» сохранён на телефон (смотри «Загрузки» / Файлы). Отправь его себе в Telegram или сохрани в заметки.';
  }
  var file = null;
  try { file = new File([blob], name, {type: blob.type}); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.share && navigator.canShare({files: [file]})) {
    navigator.share({files: [file], title: title || 'Копия тренажёра'}).then(function () { msg.textContent = 'Готово ✓ (отправлено через «Поделиться»).'; },
      function (e) { if (e && e.name === 'AbortError') { msg.textContent = 'Отменено. Копия не сохранена.'; return; } download(); });
  } else download();
}
function backupView() {
  var msg = h('div', {class: 'note', 'data-role': 'msg', style: 'margin:8px 0'});
  var out = h('div', {'data-role': 'out'});
  var textBox = h('div');
  var gzChip = (typeof CompressionStream !== 'undefined')
    ? h('button', {class: 'chip', 'data-role': 'gz', onclick: function () { useGz = !useGz; gzChip.classList.toggle('on', useGz); }}, 'Сжать (.gz, меньше размер)') : null;
  if (gzChip && useGz) gzChip.classList.add('on');
  var mkBackupText = function () { return JSON.stringify(E.makeBackup(S, activeRaw(), today())); };

  var saveBtn = h('button', {class: 'big', 'data-role': 'save-file', onclick: function () {
    var text = mkBackupText();
    fileBlob(text).then(function (r) {
      S.settings.lastBackup = today(); save();
      deliver(r.blob, 'trainer-kopiya-' + today() + r.ext, msg);
    }, function (e) { msg.textContent = 'Не получилось подготовить файл: ' + (e && e.message ? e.message : e); });
  }}, 'Сохранить копию файлом', h('small', null, 'все пакеты и весь прогресс в одном файле'));

  var showTxt = h('button', {class: 'link', 'data-role': 'show-text', onclick: function () {
    var ta = h('textarea', {readonly: 'readonly'}); ta.value = mkBackupText();
    var cb = h('button', {class: 'big alt', onclick: function () { S.settings.lastBackup = today(); save(); copyFrom(ta, cb); }}, 'Скопировать текст копии');
    textBox.replaceChildren(ta, cb);
  }}, 'Показать текст копии (запасной путь)');

  var pick = h('input', {type: 'file', id: 'pick', style: 'display:none', onchange: function () {
    var f = pick.files && pick.files[0]; if (!f) return;
    f.arrayBuffer().then(E.bytesToText).then(onText, function (e) { msg.textContent = 'Файл не прочитан: ' + (e && e.message ? e.message : e); });
    pick.value = '';
  }});
  var pickBtn = h('button', {class: 'big alt', 'data-role': 'pick-file', onclick: function () { pick.click(); }}, 'Загрузить файл', h('small', null, 'копию или пакет упражнений'));
  var inp = h('textarea', {placeholder: 'Или вставь сюда текст копии (запасной путь)', 'data-role': 'paste'});
  var readBtn = h('button', {class: 'link', 'data-role': 'read-text', onclick: function () { onText(inp.value); }}, 'Прочитать из текста');

  function known() { return activeRaw(); }
  function onText(text) {
    out.replaceChildren(); msg.textContent = '';
    var p = E.parseUpload(text);
    if (p.kind === 'error') { msg.textContent = 'Не получилось: ' + p.error + '.'; return; }
    if (p.kind === 'pack') {
      var r = E.importPack(localStorage, p.text, known());
      if (!r.ok) { msg.textContent = 'Пакет не установлен: ' + r.errors.join('; ') + '.'; return; }
      rebuildCatalog();
      msg.textContent = 'Пакет «' + r.title + '» установлен: пунктов ' + r.count + (r.replaced ? ' (обновление с версии ' + r.replaced + ')' : '') + '.' + (r.warnings.length ? ' Замечания: ' + r.warnings.join('; ') : '');
      return;
    }
    var names = (p.packs || []).map(function (x) { return x && x.title ? x.title : '?'; });
    var sum = 'Копия' + (p.created ? ' от ' + p.created : '') + ': пакеты — ' + (names.length ? names.join(', ') : 'нет (только прогресс)') +
      '; ответов в журнале: ' + p.state.events.length + '; подходов: ' + p.state.sessions.length + '; ошибок с урока: ' + p.state.lessonErrors.length + '. ' +
      'Сейчас в приложении: ответов ' + S.events.length + ', подходов ' + S.sessions.length + '.';
    var mergeBtn = h('button', {class: 'big', 'data-role': 'do-merge', onclick: function () { run('merge'); }}, 'Объединить с текущим', h('small', null, 'ничего не стирает: берёт лучшее из обоих'));
    var replBtn = h('button', {class: 'big alt', 'data-role': 'do-replace', onclick: function () {
      if (replBtn.getAttribute('data-sure') !== '1') { replBtn.setAttribute('data-sure', '1'); replBtn.firstChild.nodeValue = 'Точно заменить текущий прогресс?'; return; }
      run('replace');
    }}, 'Заменить текущий прогресс');
    out.replaceChildren(h('div', {class: 'card', 'data-role': 'summary'}, sum), mergeBtn, replBtn);
    function run(mode) {
      var rr = E.restoreBackup(localStorage, p, S, mode, known());
      if (!rr.ok) { msg.textContent = 'Не получилось: ' + rr.errors.join('; '); return; }
      S = rr.state; rebuildCatalog(); save();
      out.replaceChildren();
      msg.textContent = 'Готово ✓ ' + (mode === 'merge' ? 'Прогресс объединён.' : 'Прогресс заменён.') +
        (rr.installed.length ? ' Установлены пакеты: ' + rr.installed.join(', ') + '.' : '') + (rr.warnings.length ? ' Внимание: ' + rr.warnings.join('; ') : '');
    }
  }

  show(h('div', null,
    backBar(),
    h('h1', null, 'Резервная копия'),
    h('div', {class: 'sub'}, 'Прогресс хранится только в этом телефоне. Один файл возвращает всё: пакеты упражнений и прогресс. Последняя копия: ' + (S.settings.lastBackup || 'ещё не было') + '.'),
    saveBtn, gzChip, msg, showTxt, textBox,
    h('h2', null, 'Загрузить'),
    h('div', {class: 'note'}, 'Файл копии (восстановить) или файл пакета (добавить новые упражнения).'),
    pickBtn, pick, inp, readBtn, out));
}

/* ================= Настройки ================= */
function settingsView() {
  var seg = h('div', {class: 'seg'}, [5, 10, 15].map(function (n) {
    return h('button', {class: S.settings.size === n ? 'on' : '', onclick: function () { S.settings.size = n; save(); settingsView(); }}, String(n));
  }));
  var rst = h('button', {class: 'big alt', onclick: function () {
    if (rst.getAttribute('data-sure') !== '1') { rst.setAttribute('data-sure', '1'); rst.firstChild.nodeValue = 'Точно стереть весь прогресс?'; return; }
    S = E.freshState(); save(); home();
  }}, 'Стереть прогресс');
  var doubts = CATALOG.items.filter(function (x) { return S.items[x.key] && S.items[x.key].doubt; });
  var early = E.earlyList(CATALOG, S);
  var imp = importedIds();
  show(h('div', null,
    backBar(),
    h('h1', null, 'Настройки'),
    h('h2', null, 'Заданий в подходе'), seg,
    h('h2', null, 'Пакеты (' + CATALOG.packs.length + ')'),
    CATALOG.packs.map(function (p) {
      var isImp = imp.indexOf(p.packId) >= 0;
      var rm = isImp ? h('button', {class: 'link', 'data-role': 'remove-pack', onclick: function () {
        if (rm.getAttribute('data-sure') !== '1') { rm.setAttribute('data-sure', '1'); rm.textContent = 'Точно убрать? Прогресс останется'; return; }
        E.removeImportedPack(localStorage, p.packId); rebuildCatalog(); save(); settingsView();
      }}, 'Убрать') : null;
      return h('div', {class: 'mist', 'data-role': 'pack'}, h('b', null, p.title), ' · версия ' + p.version + ' · пунктов: ' + p.count,
        h('div', {class: 'note'}, isImp ? 'загружен файлом' : 'встроенный'), rm);
    }),
    h('h2', null, 'Рано: на потом (' + early.length + ')'),
    early.length ? early.map(function (x) {
      return h('div', {class: 'mist', 'data-role': 'early-item'},
        h('i', null, itemText(x)),
        h('button', {class: 'link', onclick: function () { E.setEarly(S, x.key, false, today()); save(); settingsView(); }}, 'Вернуть в занятия'));
    }) : h('div', {class: 'note'}, 'Пусто. Сюда попадают пункты, которые для тебя ещё рано.'),
    h('h2', null, 'Сомнения (' + doubts.length + ')'),
    doubts.length ? doubts.map(function (x) {
      return h('div', {class: 'mist'},
        h('i', null, itemText(x)),
        h('button', {class: 'link', onclick: function () { E.setDoubt(S, x.key, false, today()); save(); settingsView(); }}, 'Вернуть в занятия'));
    }) : h('div', {class: 'note'}, 'Пусто. Сюда попадают пункты, в которых ты усомнилась.'),
    h('h2', null, 'Прогресс'),
    h('div', {class: 'note'}, 'Перед стиранием лучше сделать резервную копию.'),
    rst));
}

/* ================= Старт ================= */
function loadPacks() {
  return Promise.all(BUILTIN_PACKS.map(function (url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error(url); return r.json(); }).catch(function () { return null; });
  })).then(function (packs) {
    BUILTIN_BAD = packs.filter(function (p) { return p === null; }).length;
    BUILTIN_RAW = packs.filter(function (p) { return p !== null; });
    rebuildCatalog();     // + пакеты, загруженные файлом
  });
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { storageOk = false; }
var loaded = E.loadState(localStorage);
S = loaded.state; if (!loaded.storageOk) storageOk = false;
if (loaded.source === 'migrated') save();     // миграция v1 → v2 один раз; ключ v1 не трогаем
app.appendChild(h('div', {class: 'sub'}, 'Загрузка…'));
loadPacks().then(function () {
  if (!CATALOG.items.length) {
    show(h('div', null, h('h1', null, 'Preposizioni'),
      h('div', {class: 'warn'}, 'Не удалось загрузить вопросы. Проверь интернет и открой приложение ещё раз. Прогресс не потерян.')));
    return;
  }
  home();
});
})();
